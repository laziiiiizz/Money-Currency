<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="wrapper">
        <div class="box-wrap">
            <div class="box one"></div>
            <div class="box two"></div>
            <div class="box three"></div>
            <div class="box four"></div>
            <div class="box five"></div>
            <div class="box six"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" style="display: none;">
        <div class="container">
            <h1>Currency Converter</h1>
            <div class="converter-box">
                <div class="input-group">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" min="0" step="0.01" placeholder="Enter amount">
                </div>
                <div class="input-group">
                    <label for="fromCurrency">From:</label>
                    <select id="fromCurrency">
                        <option value="USD">USD - United States Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="GBP">GBP - British Pound Sterling</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="UZS">UZS - Uzbekistan Som</option>
                        <option value="KZT">KZT - Kazakhstani Tenge</option>
                        <option value="KGS">KGS - Kyrgystani Som</option>
                        <option value="TJS">TJS - Tajikistani Somoni</option>
                        <option value="TMT">TMT - Turkmenistan Manat</option>
                        <option value="AED">AED - United Arab Emirates Dirham</option>
                        <option value="SAR">SAR - Saudi Riyal</option>
                        <option value="QAR">QAR - Qatari Riyal</option>
                        <option value="OMR">OMR - Omani Rial</option>
                        <option value="BHD">BHD - Bahraini Dinar</option>
                        <option value="KWD">KWD - Kuwaiti Dinar</option>
                        <option value="IRR">IRR - Iranian Rial</option>
                        <option value="IQD">IQD - Iraqi Dinar</option>
                        <option value="TRY">TRY - Turkish Lira</option>
                        <option value="EGP">EGP - Egyptian Pound</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="PKR">PKR - Pakistani Rupee</option>
                        <option value="BDT">BDT - Bangladeshi Taka</option>
                        <option value="RUB">RUB - Russian Ruble</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="toCurrency">To:</label>
                    <select id="toCurrency">
                        <option value="USD">USD - United States Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="GBP">GBP - British Pound Sterling</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="UZS">UZS - Uzbekistan Som</option>
                        <option value="KZT">KZT - Kazakhstani Tenge</option>
                        <option value="KGS">KGS - Kyrgystani Som</option>
                        <option value="TJS">TJS - Tajikistani Somoni</option>
                        <option value="TMT">TMT - Turkmenistan Manat</option>
                        <option value="AED">AED - United Arab Emirates Dirham</option>
                        <option value="SAR">SAR - Saudi Riyal</option>
                        <option value="QAR">QAR - Qatari Riyal</option>
                        <option value="OMR">OMR - Omani Rial</option>
                        <option value="BHD">BHD - Bahraini Dinar</option>
                        <option value="KWD">KWD - Kuwaiti Dinar</option>
                        <option value="IRR">IRR - Iranian Rial</option>
                        <option value="IQD">IQD - Iraqi Dinar</option>
                        <option value="TRY">TRY - Turkish Lira</option>
                        <option value="EGP">EGP - Egyptian Pound</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="PKR">PKR - Pakistani Rupee</option>
                        <option value="BDT">BDT - Bangladeshi Taka</option>
                        <option value="RUB">RUB - Russian Ruble</option>
                    </select>
                </div>
                <button id="convertButton">Convert</button>
                <div id="result"></div>
                <div id="exchangeRate"></div>
            </div>
            <div class="creator-note">Made by Laziz</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
